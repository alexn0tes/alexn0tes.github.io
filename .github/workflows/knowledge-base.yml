name: Verify private knowledge base

on:
  pull_request:
    paths: ["knowledge-base/**", ".github/workflows/knowledge-base.yml"]
  push:
    branches: ["main"]
    paths: ["knowledge-base/**", ".github/workflows/knowledge-base.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: knowledge-base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: knowledge-base/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
